name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_suffix: win64
          - os: macos-latest
            asset_suffix: macos
          - os: ubuntu-latest
            asset_suffix: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller pillow

      - name: Install UPX (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          curl -sL -o upx.zip https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip
          unzip -q upx.zip
          echo "UPX_DIR=$(ls -d upx-*/ | head -1)" >> $GITHUB_ENV

      - name: Install UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          curl -sL -o upx.tar.xz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
          tar -xf upx.tar.xz
          echo "UPX_DIR=$(ls -d upx-*/ | head -1)" >> $GITHUB_ENV

      - name: Build executable
        shell: bash
        run: |
          VERSION=$(python - <<'EOF'
          import re
          src = open('photo_organizer.py', encoding='utf-8').read()
          m = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', src)
          print(m.group(1))
          EOF
          )
          if [ -n "$UPX_DIR" ]; then
            pyinstaller --onefile --upx-dir "$UPX_DIR" --name "photo-organizer-v${VERSION}-${{ matrix.asset_suffix }}" photo_organizer.py
          else
            pyinstaller --onefile --noupx --name "photo-organizer-v${VERSION}-${{ matrix.asset_suffix }}" photo_organizer.py
          fi

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: false
