name: Build Executables

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的 tag（如 v0.2.1），留空则仅构建不发布'
        required: false
        default: 'v0.2.1'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_suffix: win64
          - os: macos-latest
            asset_suffix: macos
          - os: ubuntu-latest
            asset_suffix: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller "pillow==12.3.0"

      - name: Install UPX (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          curl -sL -o upx.zip https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip
          unzip -q upx.zip
          echo "UPX_DIR=$(ls -d upx-*/ | head -1)" >> $GITHUB_ENV

      - name: Install UPX (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          curl -sL -o upx.tar.xz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
          tar -xf upx.tar.xz
          echo "UPX_DIR=$(ls -d upx-*/ | head -1)" >> $GITHUB_ENV

      - name: Prepare release notes
        run: |
          awk '/^## \[/{c++} c==1{print} c==2{exit}' CHANGELOG.md > body.md

      - name: Build executable (GUI windowed)
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*__version__[[:space:]]*=[[:space:]]*[\"']\([^\"']*\)[\"'].*/\1/p" photo_organizer.py | head -1)
          ICON_OPTS=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then ICON_OPTS="--icon assets/icon.ico"; fi
          if [ -n "$UPX_DIR" ]; then
            pyinstaller --onefile --noconsole --upx-dir "$UPX_DIR" $ICON_OPTS --name "photo-organizer-v${VERSION}-${{ matrix.asset_suffix }}" photo_organizer.py
          else
            pyinstaller --onefile --noconsole --noupx $ICON_OPTS --name "photo-organizer-v${VERSION}-${{ matrix.asset_suffix }}" photo_organizer.py
          fi

      - name: Build executable (CLI)
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*__version__[[:space:]]*=[[:space:]]*[\"']\([^\"']*\)[\"'].*/\1/p" photo_organizer.py | head -1)
          ICON_OPTS=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then ICON_OPTS="--icon assets/icon.ico"; fi
          if [ -n "$UPX_DIR" ]; then
            pyinstaller --onefile --upx-dir "$UPX_DIR" $ICON_OPTS --name "photo-organizer-cli-v${VERSION}-${{ matrix.asset_suffix }}" photo_organizer.py
          else
            pyinstaller --onefile --noupx $ICON_OPTS --name "photo-organizer-cli-v${VERSION}-${{ matrix.asset_suffix }}" photo_organizer.py
          fi

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          files: dist/*
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: false
          overwrite: true
          body_path: body.md
